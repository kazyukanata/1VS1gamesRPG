<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>魔王 vs 勇者 - 30ターンの決戦</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0b14;color:#eee;font:15px/1.5 "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:520px;min-height:100vh;display:flex;flex-direction:column}

</style></head><body>
<div id="app"><div id="hud"></div><canvas id="c"></canvas><div id="bi"></div><div id="msg"></div><div id="btns"></div></div>
<div id="stick"><div id="knob"></div></div>
<div id="tt"><canvas id="tc" width="160" height="64"></canvas><h1>魔王 vs 勇者</h1><div class="sub">30ターンの決戦</div><div id="ts">画面をタップしてスタート</div></div>
<div id="cv"><div class="w"><div id="ct"></div><div id="cb"></div><div id="cl"></div></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');cv.width=160;cv.height=144;
const mk=s=>s.split('/'),rnd=n=>Math.random()*n|0,pick=a=>a[rnd(a.length)],sl=ms=>new Promise(r=>setTimeout(r,ms));
const P={k:'#111',w:'#fff',s:'#f5c9a0',b:'#3a6ee8',B:'#1d3a8a',r:'#d03030',R:'#701818',y:'#f0d020',g:'#3cb043',G:'#1f6f2a',p:'#8a3cc0',P:'#4a1e6e',n:'#8a5a2a',e:'#9aa0aa',E:'#555a66',o:'#e88a20',c:'#40c8e0'};
const S={
hero:mk('..nnnn../.nssssn./..sksk../..ssss../.bbbbbb./sbbbbbbs/.bb..bb./.nn..nn.'),
demon:mk('y.yyyy.y/.yyyyyy./.rrrrrr./.rkrrkr./..rrrr../.PPPPPP./PPPyyPPP/.PP..PP.'),
bar:mk('..nnnn../.nssssn./..sksk../..ssss../.wwwwww./rwwwwwwr/.ww..ww./.nn..nn.'),
trn:mk('..eeee../.eEEEEe./..sksk../..ssss../.eeeeee./eeoeeoee/.ee..ee./.EE..EE.'),
priest:mk('..PPPP../.PPPPPP./.PkPPkP./.PPssPP./.PPPPPP./PPPrrPPP/PPPPPPPP/.PPPPPP.'),
gd:mk('..gggg../.gggggg./..sksk../..ssss../.GGGGGG./sGGyyGGs/.GG..GG./.nn..nn.'),
mer:mk('..oooo../.oooooo./..sksk../..ssss../.nnnnnn./snnyynns/.nn..nn./.EE..EE.'),
eng:mk('r......r/.rrrrrr./.rkrrkr./..rrrr../.EEEEEE./EEoEEoEE/.EE..EE./.nn..nn.'),
dm:mk('..kkkk../.kkkkkk./.kykkyk./.kkkkkk./.PPPPPP./kPPyyPPk/.PP..PP./.kk..kk.'),
butl:mk('..wwww../.wwwwww./..sksk../..ssss../.kkkkkk./skkwwkks/.kk..kk./.kk..kk.'),
slime:mk('......../...cc.../..cccc../.cccccc./cckccckc/cccccccc/cccccccc/.cccccc.'),
zombie:mk('..gggg../.gGGGGg./.gkGGkg./..gggg../.eeeeee./geeeeeeg/.ee..ee./.EE..EE.'),
dragon:mk('R......R/RR.rr.RR/RRrrrrRR/.rkrrkr./.rrooor./..rooor./.rrrrrr./.rr..rr.'),
evil:mk('..rrrr../.EEEEEE./.ErEErE./..EEEE../eEEEEEEe/eEEEEEEe/.EE..EE./.ee..ee.'),
mimic:mk('......../......../.nnnnnn./nnykkynn/nrrrrrrn/nwnwnwnn/nnnnnnnn/.nnnnnn.'),
warr:mk('..rrrr../.rssssr./..sksk../..ssss../.rrrrrr./srrrrrre/.rr..rr./.nn..nn.'),
mage:mk('...pp.../..pppp../..sksk../..ssss../.pppppp./sppyypps/.pp..pp./.nn..nn.'),
prst:mk('..wwww../.wwwwww./..sksk../..ssss../.wwyyww./swwyywws/.ww..ww./.nn..nn.'),
vil:mk('...rr.../..rrrr../.rrrrrr./rrrrrrrr/.wwwwww./.wyywnw./.wyywnw./.wwwwww.'),
cave:mk('..EEEE../.EEEEEE./EEEkkEEE/EEkkkkEE/EEkkkkEE/EEkkkkEE/EEkkkkEE/eeeeeeee'),
fnt:mk('..c..c../...cc.../..cccc../eeeeeeee/ecccccce/eccwwcce/ecccccce/eeeeeeee'),
chst:mk('......../.nnnnnn./nyyyyyyn/nnnyynnn/nnnyynnn/nnnnnnnn/nnnnnnnn/........'),
cstl:mk('r.r..r.r/rrr..rrr/EEEEEEEE/EkEEEEkE/EEEkkEEE/EEkkkkEE/EEkkkkEE/EEEEEEEE'),
q:mk('..yyyy../.yy..yy./....yy../...yy.../...yy.../......../...yy.../........')};
function sp(n,px,py,s=2,g=x){const d=S[n];for(let j=0;j<8;j++)for(let i=0;i<8;i++){const c=d[j][i];if(c!='.'){g.fillStyle=P[c];g.fillRect(px+i*s,py+j*s,s,s)}}}
const TY=['スライム','ゾンビ','あくまのよろい','ドラゴン'],SP={'スライム':'slime','ゾンビ':'zombie','あくまのよろい':'evil','ドラゴン':'dragon','ミミック':'mimic'};
const RT={2:70,3:50,4:30,5:15,6:5};
const roll=()=>{const n=rnd(100);return TY[n<40?0:n<70?1:n<90?2:3]};
const TM={'スライム':[1,.8],'ゾンビ':[1.2,1],'あくまのよろい':[1.4,1.2],'ドラゴン':[1.7,1.5],'ミミック':[1.2,1]};
const mst=m=>({hp:Math.round((30+12*m.r)*TM[m.t][0]),atk:Math.round((6+3*m.r)*TM[m.t][1])});
const NM={vil:'村/街',cave:'洞窟',fnt:'精霊の泉',chst:'宝箱',cstl:'魔王城',mer:'商人'},CL=['戦士','魔法つかい','僧侶'],EF=['攻撃力+','固定ダメージ+','防御力+'],EM=[2,3,2],pr=()=>{const k=(G.turn-1)/29,p3=.05+.3*k,p2=.2+.3*k,n=Math.random();return n<p3?3:n<p3+p2?2:1},CS=['warr','mage','prst'];
let G={turn:1,side:'',act:0,fog:false,pos:-1,q:[],tD:0,tH:0,tiles:[],dmn:0,over:false},
D={hp:300,mhp:300,build:0,bank:0,tier:1},
H={hp:100,mhp:100,atk:10,def:2,gold:0,gear:0,story:1,party:[],skills:[],items:0,bank:0,bonus:false,train:0,immuneTurn:-1,nextTile:null,cleave:false};
const HA=()=>H.atk+H.gear*4+H.story*2+pb(0)*2,HD=()=>H.def+H.gear*2+pb(2)*2,pb=c=>H.party.filter(p=>p.c==c).reduce((a,p)=>a+p.r,0);
const ROOMS={d:{f:['#2a1838','#331f44'],me:'demon',npcs:[['邪教の司祭','priest',2,2],['悪魔の技師','eng',7,2],['闇の商人','dm',2,5],['魔王の執事','butl',7,5]]},
h:{f:['#3c7a3c','#468a44'],me:'hero',npcs:[['酒場マスター','bar',2,2],['訓練教官','trn',7,2],['旅の商人','mer',2,5],['案内人','gd',7,5]]}};
let scene='',room=null,me={x:5,y:7},face=[0,-1],canMove=false,sh=0,BT=[];
function cm(v){canMove=v;document.body.style.touchAction=v?'none':'pan-y'}
const ent=(n,s,x,y,hp)=>({n,s,x,y,hp});
/* ---- 描画 ---- */
const OX=7,OY=18,TF=Array.from({length:45},(_,i)=>[(i*67+13)%158,(i*41+29)%142]);
const nd=i=>{if(i<0)return{x:OX,y:OY-14};const r=i/6|0,c=r%2?5-i%6:i%6;return{x:OX+c*26,y:OY+r*26}};
function draw(t){const bb=(t/400|0)%2;x.fillStyle='#000';x.fillRect(0,0,160,144);
if(scene=='room'){for(let j=0;j<9;j++)for(let i=0;i<10;i++){const w=i==0||j==0||i==9||j==8;x.fillStyle=w?'#111':room.f[(i+j)&1];x.fillRect(i*16,j*16,16,16)}
room.npcs.forEach(n=>sp(n[1],n[2]*16,n[3]*16+bb));sp(room.me,me.x*16,me.y*16+bb)}
else if(scene=='path'){x.fillStyle='#20301f';x.fillRect(0,0,160,144);x.fillStyle='#2c4429';TF.forEach(([a,b])=>x.fillRect(a,b,2,2));
for(let i=0;i<30;i++){const a=nd(i-1),b=nd(i),dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y);
if(i>0){x.fillStyle=i<=G.pos?'#e8d080':'#3f5a3c';for(let k=10;k<=16;k+=3)x.fillRect(a.x+8+dx*k-1,a.y+8+dy*k-1,2,2)}
const seen=i<=G.pos&&G.tiles[i];x.globalAlpha=seen?1:.45;sp(seen?G.tiles[i]:'q',b.x,b.y);x.globalAlpha=1}
let p=nd(G.pos);if(G.walk){const w=G.walk,u=Math.min(1,(Date.now()-w.t0)/900),A=nd(w.a),B=nd(w.b);p={x:A.x+(B.x-A.x)*u,y:A.y+(B.y-A.y)*u}}
if(G.walk||G.pos<0)sp('hero',p.x,p.y+bb,2);else{x.strokeStyle='#ff0';x.strokeRect(p.x-1.5,p.y-1.5,19,19);sp('hero',p.x+9,p.y+9,1)}}
else if(scene=='bat'){x.fillStyle='#15152a';x.fillRect(0,0,160,144);x.fillStyle='#26264a';x.fillRect(0,64,160,80);
BT.forEach(e=>{sp(e.n,e.x+sh,e.y+bb*2,e.s);if(e.hp){const[h,m]=e.hp(),w=8*e.s;x.fillStyle='#600';x.fillRect(e.x,e.y-5,w,3);x.fillStyle='#3d3';x.fillRect(e.x,e.y-5,w*Math.max(0,h)/m,3)}})}}
(function L(t){draw(t);requestAnimationFrame(L)})(0);
async function shake(){for(let i=0;i<6;i++){sh=i%2?-3:3;await sl(40)}sh=0}
/* ---- UI部品 ---- */
function hud(){let s=`ターン ${G.turn}/30`;if(G.side=='d')s+=`　魔王 HP ${D.hp}/${D.mhp}　行動 ${G.act}回`;else if(G.side=='h')s+=`　勇者 HP ${H.hp}/${H.mhp}　行動 ${G.act}回`;$('hud').textContent=s}
function setBtns(a){const e=$('btns');e.innerHTML='';a.forEach(([l,f,d])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>f();if(d)b.disabled=true;e.appendChild(b)})}
function menu(t,a){cm(false);$('msg').textContent=t;setBtns(a)}
function say(t,b='次へ'){return new Promise(r=>menu(t,[[b,r]]))}
function note(t,ms=900){cm(false);$('msg').textContent=t;setBtns([]);return sl(ms)}
function ask(t,l,nb){return new Promise(r=>menu(t,[...l.map((s,i)=>[s,()=>r(i)]),...(nb?[]:[['戻る',()=>r(-1)]])]))}
function idle(){cm(!G.over);$('msg').textContent='画面のどこでもドラッグして移動。NPCの隣でタップすると話しかけられる。';setBtns([['行動を終える',endPhase]]);hud()}
function cover(t,b,f,l='画面をタップして進む',bo){$('ct').textContent=t;$('cb').textContent=b;$('cb').style.textAlign='';$('cl').textContent=l;$('msg').textContent='';$('bi').textContent='';setBtns([]);scene='';cm(false);const v=$('cv'),t0=Date.now();v.style.display='flex';v.onclick=e=>{if(bo&&!e.target.closest('#cl'))return;if(Date.now()-t0<400)return;v.style.display='none';f()}}
const info=m=>$('bi').textContent=`勇者 HP ${H.hp}/${H.mhp}　${m.t} HP ${Math.max(0,m.hp)}/${m.mhp}`;
/* ---- 入力(仮想コントローラーなし) ---- */
const stk=$('stick'),knob=$('knob');let st=null;
function adj(){const a=room.npcs.filter(n=>Math.abs(n[2]-me.x)+Math.abs(n[3]-me.y)==1);return a.find(n=>n[2]==me.x+face[0]&&n[3]==me.y+face[1])||a[0]}
function dirOf(){if(Math.hypot(st.dx,st.dy)<16)return null;return Math.abs(st.dx)>Math.abs(st.dy)?[Math.sign(st.dx),0]:[0,Math.sign(st.dy)]}
document.addEventListener('pointerdown',e=>{if(!canMove||st||e.target.closest('button'))return;
st={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0,t:Date.now(),mv:false,tg:e.target};
stk.style.cssText=`display:block;left:${e.clientX-48}px;top:${e.clientY-48}px`;knob.style.transform='translate(0,0)';
st.iv=setInterval(()=>{if(!canMove||!st)return;const d=dirOf();if(d){st.mv=true;go(...d)}},150)});
document.addEventListener('pointermove',e=>{if(!st||e.pointerId!=st.id)return;let dx=e.clientX-st.ox,dy=e.clientY-st.oy;const d=Math.hypot(dx,dy);if(d>40){dx*=40/d;dy*=40/d}st.dx=dx;st.dy=dy;knob.style.transform=`translate(${dx}px,${dy}px)`});
document.addEventListener('pointerup',e=>{if(!st||e.pointerId!=st.id)return;clearInterval(st.iv);stk.style.display='none';const s=st;st=null;
if(!s.mv&&Date.now()-s.t<450&&Math.hypot(s.dx,s.dy)<16&&canMove){let n=null;
if(s.tg===cv){const r=cv.getBoundingClientRect(),tx=(e.clientX-r.left)/r.width*10|0,ty=(e.clientY-r.top)/r.height*9|0;n=room.npcs.find(n=>n[2]==tx&&n[3]==ty&&Math.abs(n[2]-me.x)+Math.abs(n[3]-me.y)==1)}
n=n||adj();if(n)talk(n)}});
document.addEventListener('pointercancel',e=>{if(st&&e.pointerId==st.id){clearInterval(st.iv);stk.style.display='none';st=null}});
function go(a,b){face=[a,b];const nx=me.x+a,ny=me.y+b;if(nx<1||ny<1||nx>8||ny>7||room.npcs.some(n=>n[2]==nx&&n[3]==ny))return;me.x=nx;me.y=ny}
addEventListener('keydown',e=>{if(!canMove)return;const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k){e.preventDefault();go(...k)}});
/* ---- コマンド ---- */
const CMD={h:{
'酒場マスター':[['仲間を集める',async()=>{if(H.party.length>=3){await say('仲間は最大3人までだ。');return false}const bo=H.bonus;H.bonus=false;const r=Math.min(3,pr()+(bo?1:0)),c=rnd(3);H.party.push({c,r});return `仲間【${CL[c]} ${'★'.repeat(r)}】が加わった！\n（${EF[c]}${r*EM[c]}）`}],
['仲間と別れる',async()=>{if(!H.party.length){await say('別れる仲間がいない。');return false}const i=await ask('誰と別れる？',H.party.map(p=>CL[p.c]+' '+'★'.repeat(p.r)));if(i<0)return false;const p=H.party.splice(i,1)[0];return `${CL[p.c]}と別れた。`}]],
'訓練教官':[['モンスターを倒す',async()=>{H.atk+=3;H.mhp+=8;H.hp+=8;H.train++;let s='訓練でモンスターを倒した！\n攻撃力+3　最大HP+8';const K=['強打','回復','全力斬り'];if(H.train%3==0&&H.skills.length<3){H.skills.push(K[H.skills.length]);s+=`\nスキル【${K[H.skills.length-1]}】を習得！`}return s}]],
'旅の商人':[['お金を集める',async()=>{const g=Math.round((20+rnd(21))*(H.bonus?1.5:1));H.bonus=false;H.gold+=g;return `${g}ゴールドを集めた（所持 ${H.gold}）`}]],
'案内人':[['行動回数を貯める',async()=>{H.bank=1;return '1回分の行動を温存した。（次回の行動回数+1）'}]]},
d:{
'邪教の司祭':[['モンスターの召喚',async()=>{G.q.push({k:'sum',r:D.tier});return '召喚の儀式を行った。\n何が現れるかは、発動時に決まる。'}],
['モンスターの配合',async()=>{if(D.tier>=6){await say('これ以上、強いモンスターは配合できない。');return false}const pc=RT[D.tier+1],y=await ask(`配合の成功率は ${pc}%。\nやってみる？`,['配合する']);if(y<0)return false;
if(Math.random()*100<pc){D.tier++;return '配合成功！\n以前より強力なモンスターを召喚できるようになった。'+(D.tier<6?`\n（次の配合の成功率 ${RT[D.tier+1]}%）`:'\n（これ以上の配合はできない）')}return '配合失敗…'}]],
'悪魔の技師':[['トラップの設置',async()=>{const t=pick(['呪いの霧','落とし穴','毒の罠']);if(t=='呪いの霧')G.fog=true;else G.q.push({k:'trap',n:t,d:t=='落とし穴'?15+rnd(11):8+rnd(5)});return `トラップ【${t}】を仕掛けた。`}]],
'闇の商人':[['闇の商人を送り込む',async()=>{G.dmn++;return '闇の商人を勇者の元へ送り込んだ。'}]],
'魔王の執事':[['魔王城の構築',async()=>{D.build++;return `魔王城を構築した（構築度 ${D.build}）`}],['行動の持ち越し',async()=>{D.bank=1;return '1回分の行動を温存した。（次回の行動回数+1）'}]]}};
function talk(n){cm(false);menu(`【${n[0]}】何をする？`,[...CMD[G.side][n[0]].map(c=>G.used.has(c[0])?[c[0]+'（今ターン選択済み）',()=>{},1]:[c[0],()=>act(c)]),['やめる',idle]])}
async function act(c){let f=c[1],k=c[0];
if(G.side=='h'&&G.fog){G.fog=false;await say('【 呪いの霧が発動！ 】\n選択肢とは別の行動をする！');const o=Object.values(CMD.h).flat().filter(z=>z[0]!=c[0]&&!G.used.has(z[0]));if(o.length){const z=pick(o);f=z[1];k=z[0]}}
const r=await f();if(r===false){idle();return}
G.used.add(k);G.act--;hud();
if(G.act<=0){await say(r+'\n\n行動回数を使い切った。');endPhase()}else menu(r+`\n\n残り行動 ${G.act}回`,[['続ける',idle]])}
/* ---- フェーズ進行 ---- */
function startPhase(s){G.side=s;G.used=new Set();const o=s=='d'?D:H;G.act=Math.min(3,2+o.bank);o.bank=0;room=ROOMS[s];scene='room';me={x:5,y:7};
if(s=='h'&&G.dmn){const g=Math.min(H.gold,(20+rnd(21))*G.dmn);H.gold-=g;G.dmn=0;hud();say('【 闇の商人が現れた！ 】\n魔王の手先に所持金を巻き上げられた…').then(idle)}else idle()}
function endPhase(){cm(false);
if(G.side=='d'){G.side='';cover('【 勇者軍のターンです！ 】','プレイヤー交代してください。\n準備ができたら画面をタップしてください。',()=>startPhase('h'))}
else{G.side='';cover('【 閲覧フェーズ 】','魔王軍・勇者軍の両プレイヤーで、一緒に画面を見てください。\n「開始する」を押すと、このターンの結果が始まります。',resolve,'[ 開始する ]',1)}}
function dead(){if(H.hp<=0){H.hp=0;end('d');return true}return false}
async function fight(kind,m){const T=mst(m);m.hp=m.mhp=T.hp;m.atk=T.atk;const sn=SP[m.t];scene='bat';
BT=kind=='sum'?[ent('hero',4,100,16,()=>[H.hp,H.mhp]),ent(sn,6,20,80,()=>[m.hp,m.mhp])]:[ent(sn,4,100,16,()=>[m.hp,m.mhp]),ent('hero',5,16,88,()=>[H.hp,H.mhp]),...H.party.map((p,i)=>ent(CS[p.c],3,60+i*26,112))];
while(m.hp>0&&H.hp>0){info(m);const d=HA()+pb(1)*3+rnd(5);m.hp-=d;shake();await note(`勇者の攻撃！ ${d}ダメージ`,600);info(m);if(m.hp<=0)break;
const e=Math.max(1,m.atk-HD())+rnd(4);H.hp-=e;G.tD+=e;shake();await note(`${m.t}の攻撃！ ${e}ダメージ`,700)}
info(m);await sl(300);$('bi').textContent='';scene='path';return m.hp<=0}
async function resolve(){scene='path';G.tD=G.tH=0;$('hud').textContent=`ターン ${G.turn}/30　閲覧フェーズ`;
for(const q of G.q){
if(q.k=='sum'){const sm={t:roll(),r:q.r};await say(`【 魔王の仕込み発動！ 】\n召喚モンスター【${sm.t}】が勇者に襲いかかる！`);await fight('sum',sm);if(dead())return;H.gold+=15;await say('戦闘勝利！　勇者は召喚モンスターを撃退した。')}
else if(H.immuneTurn==G.turn){await say(`【 仕込み発動！ 】\n${q.n}！\n勇者はトラップを回避した！`)}
else{H.hp-=q.d;G.tD+=q.d;await say(`【 仕込み発動！ 】\n${q.n}！　勇者は${q.d}ダメージを受けた。`);if(dead())return}}
G.q=[];const t=G.turn==30?'cstl':(H.nextTile||pick(['vil','cave','fnt','chst','mer'])),cl=H.cleave;H.nextTile=null;H.cleave=false;H.story=Math.min(5,1+((G.turn-1)/6|0));G.walk={a:G.pos,b:G.pos+1,t0:Date.now()};await note('勇者は次のマスへ歩き出す…',1000);G.pos++;G.tiles[G.pos]=t;G.walk=null;
await say(`勇者が止まったマス：${NM[t]}`);
if(t=='vil'){H.bonus=true;await say('勇者は村/街で一息ついた。')}
else if(t=='cave'){const m={t:roll(),r:Math.min(6,1+(G.turn/6|0))};if(cl)await say(`洞窟の【${m.t}】を、ダメージを受けずに討伐した！`);else{await fight('cave',m);if(dead())return;await say('戦闘勝利！')}H.atk+=2;H.mhp+=3;H.hp+=3}
else if(t=='fnt'){const h=Math.min(30,H.mhp-H.hp);H.hp+=h;G.tH+=h;await say(`精霊の泉の力で、勇者の体力が${h}回復した。`)}
else if(t=='chst'){const r=rnd(3);
if(r==0){if(H.gear<5)H.gear++;else H.gold+=30;await say('勇者は宝箱を開けた。')}
else if(r==1){const h=Math.min(20,H.mhp-H.hp);H.hp+=h;G.tH+=h;await say(`宝箱から回復の光！　勇者の体力が${h}回復した。`)}
else{await say('宝箱はミミックだった！');await fight('cave',{t:'ミミック',r:2+(G.turn/10|0)});if(dead())return;H.gold+=30;await say('戦闘勝利！')}}
else if(t=='mer'){await merchant()}
else{await finale();return}
await say(`【 魔王軍への報告 】\n勇者が止まったマス：${NM[t]}\n勇者に与えたダメージ：${G.tD}\n勇者が回復した体力：${G.tH}`);
G.turn++;cover('【 魔王軍のターンです！ 】','プレイヤー交代してください。\n準備ができたら画面をタップしてください。',()=>startPhase('d'))}
async function merchant(){
await new Promise(r=>cover('【 旅の商人に出会った！ 】','ここからは勇者軍プレイヤーだけが画面を見てください。\n魔王軍プレイヤーは画面から目をそらしてください。',r,'[ 勇者軍が品を選ぶ ]',1));scene='path';
const O=[['HPを10〜50回復する',()=>{const h=Math.min(10+rnd(41),H.mhp-H.hp);H.hp+=h;G.tH+=h;return `体力が${h}回復した！`}],
['次のターンのみ、魔王のトラップのダメージを受けない',()=>{H.immuneTurn=G.turn+1;return '次のターン、トラップのダメージを受けなくなった！'}],
['攻撃力を1〜5上げる',()=>{const v=1+rnd(5);H.atk+=v;return `攻撃力が${v}上がった！`}],
['防御力を1〜5上げる',()=>{const v=1+rnd(5);H.def+=v;return `防御力が${v}上がった！`}],
['次のマスを必ず街マスにする',()=>{H.nextTile='vil';return '次のマスは必ず村/街になる！'}],
['次のマスが洞窟なら、ダメージなしで討伐できる',()=>{H.cleave=true;return '次のマスが洞窟なら、ダメージを受けずに討伐できる！'}]];
const ch=O.map(o=>[Math.random(),o]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(a=>a[1]);
const i=await ask('【 旅の商人 】3つの品から1つを選んでください。',ch.map(o=>o[0]),1);
await say(ch[i][1]());
await new Promise(r=>cover('【 閲覧フェーズに戻ります 】','魔王軍・勇者軍の両プレイヤーで、一緒に画面を見てください。',r,'[ 続ける ]',1));scene='path'}
async function finale(){
await new Promise(r=>cover('【 最終決戦：魔王城に到達！ 】','勇者軍・魔王軍 両プレイヤーは画面に注目してください。\n世界の命運をかけた、最後の戦いが始まります。',r,'[ 最後の戦いを始める ]',1));
scene='bat';const gs=[roll(),roll()].map(t=>({t,r:D.tier})),dd=5+D.build*2,use=[3,2,1];
BT=[ent('demon',5,104,10,()=>[D.hp,D.mhp]),...gs.map((m,i)=>ent(SP[m.t],4,20+i*34,26)),ent('hero',5,16,88,()=>[H.hp,H.mhp]),...H.party.map((p,i)=>ent(CS[p.c],3,60+i*26,112))];
const fi=()=>$('bi').textContent=`勇者 HP ${H.hp}/${H.mhp}　魔王 HP ${Math.max(0,D.hp)}/${D.mhp}`;
$('hud').textContent='最終決戦　魔王城';
while(true){fi();let done=false;
while(!done){const a=await ask('勇者のターン！　どうする？',['たたかう','スキル','アイテム'],1);
if(a==0){const d=Math.max(1,HA()-dd)+pb(1)*3+rnd(5);D.hp-=d;shake();await note(`勇者の攻撃！　魔王に${d}ダメージ`);done=true}
else if(a==1){if(!H.skills.length){await say('習得したスキルがない。');continue}
const i=await ask('どのスキル？',H.skills.map((s,k)=>`${s}（残り${use[k]}回）`));if(i<0)continue;if(use[i]<=0){await say('もう使えない。');continue}use[i]--;
if(i==1){const h=Math.min(30,H.mhp-H.hp);H.hp+=h;await note(`勇者は傷を癒した！　体力${h}回復`)}
else{const d=Math.max(1,i==0?Math.round(HA()*1.8)-dd:Math.round(HA()*2.5)-(dd>>1))+pb(1)*3;D.hp-=d;shake();await note(`${H.skills[i]}！　魔王に${d}ダメージ`)}done=true}
else{if(!H.items){await say('薬草を持っていない。');continue}H.items--;const h=Math.min(40,H.mhp-H.hp);H.hp+=h;await note(`薬草を使った！　体力${h}回復`);done=true}}
fi();if(D.hp<=0){end('h');return}
const e=Math.max(1,10+D.build-HD())+gs.reduce((s,m)=>s+Math.max(1,Math.round(mst(m).atk*.5)-HD()),0);H.hp-=e;shake();
await note(`魔王軍の攻撃！　勇者は${e}ダメージ`,1000);fi();if(dead())return}}
function end(w){G.over=true;cm(false);cover(w=='h'?'【 勇者軍の勝利！ 】':'【 魔王軍の勝利！ 】',w=='h'?'見事、魔王の討伐に成功した！\n世界に再び光と平和が戻った。\n勇者プレイヤーの勝ちです！':'勇者軍は力尽き、全滅した…\n世界は永遠の闇に包まれた。\n魔王プレイヤーの勝ちです！',()=>location.reload(),'もう一度遊ぶ')}
/* ---- 開始 ---- */
function title(){const t=$('tt'),c=$('tc').getContext('2d'),t0=Date.now();c.clearRect(0,0,160,64);sp('demon',12,8,6,c);sp('cstl',64,16,4,c);sp('hero',100,8,6,c);
t.style.display='flex';t.onclick=()=>{if(Date.now()-t0<400)return;t.style.display='none';rules()}}
function rules(){cover('【 遊び方 】','・魔王軍と勇者軍が、1台のスマホを交代で操作する2人対戦。全30ターン。\n・1ターンの流れ：魔王の行動 → 勇者の行動 → 閲覧フェーズ（2人で一緒に結果を見る）。\n・行動回数は両軍とも1ターン2回。「貯める」で1回分を温存でき、最大3回まで。\n・同じ行動は、1ターンに1回まで選べる。\n・基地では画面のどこでもドラッグして移動。NPCの隣でタップすると話しかけられ、コマンドを選べる。\n・作戦やステータスは相手に秘密。待機側は画面を見ないこと。\n・30ターン目は魔王城で最終決戦。先にHPが0になった方の負け。',
()=>cover('【 魔王軍のターンです！ 】','魔王プレイヤーに端末を渡してください。\n準備ができたら画面をタップしてください。',()=>startPhase('d')),'タップして始める');$('cb').style.textAlign='left'}
hud();title();
</script></body></html>
