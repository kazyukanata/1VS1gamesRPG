function heroSkillEffect(sk,base,SKS,tgt){let d,tx='勇者は特技を使った！';
if(sk=='ためる'){d=0;SKS.charge=true;tx+='\n【ためる】次の攻撃に力を溜めている…'}
else if(sk=='斬撃波'){d=Math.round(base*1.3)}
else if(sk=='我慢爆発'){d=0;SKS.gb=1;SKS.guardDmg=0;SKS.guarding=true;tx+='\n【我慢爆発】受け身の構えに入った……'}
else if(sk=='やり返し'){d=base;SKS.reflect=3;tx+='\n【やり返し】3ターンの間、受けたダメージを跳ね返す！'}
else if(sk=='生命の交換'){const hh=H.hp,th=tgt.hp;H.hp=Math.min(H.mhp,th);tgt.hp=Math.min(tgt.mhp,hh);d=0;tx+='\n【生命の交換】互いの残り体力を入れ替えた！'}
else if(sk=='魔光弾'){d=20;SKS.fixed=true;tx+='\n【魔光弾】固定20ダメージ！'}
else if(sk=='魔光弾砲'){d=50;SKS.fixed=true;tx+='\n【魔光弾砲】固定50ダメージ！'}

function getFinaleCommandPool(side,currentPlan=[]){

    else if(heroAction.startsWith('skill:')){const sk=heroAction.replace(/^skill:/,'');const r=heroSkillEffect(sk,base,SKS,D);d=r.d;tx=r.tx;if(SKS.charge)charge=true}
    else if(rd==1&&pl=='gan')d=Math.round(base*1.3);
    else if(rd==1&&pl=='iro'&&H.skills.length){const avail=H.skills.filter(s=>!(s=='光闇の共存'&&H.coexistUsed));if(avail.length){const sk=pick(avail),r=heroSkillEffect(sk,base,SKS,D);d=r.d;tx=r.tx;if(SKS.charge)charge=true}else d=base}
    else d=base;
    if(H.dark&&d>0&&!SKS.fixed)d=Math.round(d*2.5);
    if(DKS.giant&&d>0)d=Math.round(d*2);
    if(DKS.parryTurns>0){DKS.parryTurns--;if(rnd(10)<4){d=0;await note('【受け流し】魔王軍が攻撃を受け流した！',500)}}
    if(D.guardActive){d=Math.round(d*0.7);tx+='\n【ぼうぎょ】ダメージ30%軽減';}
    D.hp-=d;shake();await note(d?`${tx} ${d}ダメージ`:tx,650);
    if(SKS.lifesteal&&d>0&&rd>1){const heal=Math.round(d*.25);H.hp=Math.min(H.mhp,H.hp+heal);await note(`【闇包】${heal}回復した！`,500)}
    if(D.hp<=0){end('h');return}
    let e=Math.max(1,10+D.build-HD())+gs.reduce((s,m)=>s+Math.max(1,Math.round(mst(m).atk*.5)-HD()),0),etx='魔王軍の攻撃！';
    const busy=DKS.parryTurns>0||DKS.regenTurns>0;
    if(demonAction==='guard'){e=0;etx='魔王軍はぼうぎょを選んだ。次のターン、受けるダメージは30%減少する。';D.guardReady=true}
    else if(demonAction.startsWith('skill:')){const sk=demonAction.replace(/^skill:/,'');const res=demonSkillEffect(sk,e,DKS,H);e=res.d;etx=res.tx;if(DKS.charge){e=Math.round(e*2.5);etx='魔王軍がためた力を解放！';DKS.charge=false}}
    else if(DKS.charge){e=Math.round(e*2.5);etx='魔王軍がためた力を解放！';DKS.charge=false}
    else if(!busy&&D.skills.length&&rnd(10)<4){
      const cand=D.skills.filter(sk=>{if(sk=='記憶の甦り')return DKS.lastSkill&&D.hp>200;if(sk=='受け流し'||sk=='再生')return D.hp>100;if(sk=='全闇の吸収')return H.dark;return true});
      if(cand.length){let dsk=pick(cand);etx='魔王軍は特技を使った！';
      if(dsk=='受け流し'){D.hp-=100;DKS.parryTurns=3;etx+='\n【受け流し】3ターンの間、攻撃を受け流す構え！（HP-100）'}
      else if(dsk=='再生'){D.hp-=100;DKS.regenTurns=5;etx+='\n【再生】傷を癒す力を得た！（HP-100）'}
      else if(dsk=='巨大化'){D.mhp*=2;D.hp*=2;DKS.giant=true;etx+='\n【巨大化】魔王軍のHPが倍増した！（被ダメージ2倍）'}
      else{if(dsk=='記憶の甦り'){etx+=`\n【記憶の甦り】前回の特技【${DKS.lastSkill}】を再発動！（HP-200）`;D.hp-=200;dsk=DKS.lastSkill}
      if(dsk=='ためる'){e=0;DKS.charge=true;etx+='\n【ためる】次の攻撃に力を溜めている…'}
      else if(dsk=='斬撃波'){e=Math.round(e*1.3)}
      else if(dsk=='魔弾'){e=20;etx+='\n【魔弾】固定20ダメージ！'}
      else if(dsk=='魔弾砲'){e=50;etx+='\n【魔弾砲】固定50ダメージ！'}
      else if(dsk=='全闇の吸収'){if(H.dark){H.dark=false;etx+='\n【全闇の吸収】魔王軍が闇を吸収した！勇者は闇の勇者ではなくなった。'}}
      if(['ためる','斬撃波','魔弾','魔弾砲'].includes(dsk))DKS.lastSkill=dsk}}}
    if(pl=='inochi'&&rnd(3)==0)e=0;
    if(H.guardActive){e=Math.round(e*0.7);etx+='\n【ぼうぎょ】ダメージ30%軽減';}
    const svd=H.prayerActive&&H.hp==1&&e>0;await hurt(e);
    if(SKS.guarding)SKS.guardDmg+=(svd?0:e);
    shake();if(!svd)await note(e?`${etx}　勇者は${e}ダメージ`:`${etx}\n勇者は守り切った！`,900);
    if(SKS.reflect>0){const refDmg=svd?0:e;if(refDmg>0){D.hp-=refDmg;shake();await note(`【やり返し】${refDmg}ダメージを跳ね返した！`,500);if(D.hp<=0){end('h');return}}SKS.reflect--}
    if(dead())return;
    if(H.dark&&!SKS.noDeath&&rd>=3&&D.hp>0){await say('🌑 闇の侵食が限界に到達した……\n勇者は闇に飲み込まれた。');H.hp=0;dead();return}
    H.guardActive=false;D.guardActive=false;
  }
}
function end(w){if(G.over)return;G.over=true;cm(false);cover(w=='h'?'【 勇者軍の勝利！ 】':'【 魔王軍の勝利！ 】',w=='h'?'見事、魔王の討伐に成功した！\n世界に平和が戻る。':'勇者は討伐に失敗した……\n魔王の支配が続く。',()=>{},'もう一度遊ぶ');}
function title(){const t=$('tt'),c=$('tc').getContext('2d'),t0=Date.now();c.clearRect(0,0,160,64);sp('demon',12,8,6,c);sp('cstl',64,16,4,c);sp('hero',100,8,6,c);t.style.display='flex';t.onclick=()=>{if(Date.now()-t0<400)return;t.style.display='none';rules()}}
function rules(){cover('【 遊び方 】',`・1台のスマホを交代で操作する、魔王軍 vs 勇者軍の2人対戦。\n・1ターンの流れ：魔王の行動→勇者の行動→閲覧フェーズ。\n・通常ターンでは、「仲間を集める」「特訓」などが選べる。\n・最終決戦では、10ターン分の行動を事前に選んで勝負する。`,()=>turnSelect(),'タップして始める');$('cb').style.textAlign='left'}
async function turnSelect(){scene='vs';const i=await ask('ターン数を選んでください。',['10ターン（短め）','20ターン（じっくり）'],1);
G.maxTurn=[10,20][i];G.plan=Array.from({length:G.maxTurn-1},()=>planPick());cover('【 魔王軍のターンです！ 】','魔王プレイヤーに端末を渡してください。\n準備ができたら画面をタップしてください。',()=>startPhase('d'))}
hud();title();
</script></body></html>
