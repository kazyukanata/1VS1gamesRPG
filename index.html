rulesMenu,'タップして始める');$('cb').style.textAlign='left'}

G.maxTurn=[15,30][i];G.plan=Array.from({length:G.maxTurn-1},()=>planPick());G.kazushiTurn=10+rnd(4);G.weather=pick(WT);G.nextWeather=pick(WT);
