<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>勇者軍 VS 魔王軍 - 2人対戦RPG</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-wrapper">

  <!-- メインゲームキャンバス -->
  <canvas id="game-canvas" width="240" height="160"></canvas>

  <!-- UIレイヤー（フェーズ表示・HP・ログ） -->
  <div id="ui-layer">
    <div class="top-bar">
      <span id="phase-label"></span>
      <span id="hp-label"></span>
    </div>
    <div class="bottom-bar">
      <div id="log"></div>
    </div>
  </div>

  <!-- タッチヒント（スマホ操作用） -->
  <div id="touch-hints">
    <div id="hint-up">上タップ / 上スワイプで移動</div>
    <div id="hint-down">下タップ / 下スワイプで移動</div>
    <div id="hint-left">左タップ / 左スワイプで移動</div>
    <div id="hint-right">右タップ / 右スワイプで移動</div>
  </div>

  <!-- プレイヤー交代・タイトル画面・ルール説明など -->
  <div id="overlay">
    <div id="overlay-box">
      <div id="overlay-text"></div>
      <button id="overlay-btn">画面をタップして進む</button>
    </div>
  </div>

  <!-- NPCコマンド選択パネル -->
  <div id="choice-panel"></div>

</div>

<!-- ゲームロジック -->
<script src="app.js"></script>

</body>
</html>
