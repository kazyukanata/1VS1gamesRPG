function sp(n,px,py,s=2,g=x){const d=S[n];for(let j=0;j<8;j++)for(let i=0;i<8;i++){const c=d[j][i];if(c!='.'){g.fillStyle=P[c];g.fillRect(px+i*s,py+j*s,s,s)}}}

function pickTile(){const types=['vil','cave','fnt','chst','mer','quar','tgnd'],base=100/types.length,vilW=Math.min(95,base+(H.vilBonus||0)),rest=(100-vilW)/(types.length-1);let r=Math.random()*100,acc=0;for(const t of types){acc+=t=='vil'?vilW:rest;if(r<acc)return t}return types[types.length-1]}
function reweightPlan(){for(let i=G.pos+1;i<G.plan.length;i++)G.plan[i]=pickTile()}
const pr=(pen=0)=>{const k=(G.turn-1)/(G.maxTurn-1),p3=Math.max(0,.05+.3*k-pen),p2=Math.max(0,.2+.3*k-pen),n=Math.random();return n<p3?3:n<p3+p2?2:1};
let LFD=0;

h:{f:['#3c7a3c','#468a44'],me:'hero',npcs:[['酒場マスター','bar',2,2],['訓練教官','trn',4,2],['情報屋','inf',6,2],['開拓屋','dev',8,2],['兵隊','sld',2,5],['案内人','gd',4,5],['コレクター','col',6,5]]}};
function npcsFor(s){if(s=='h'&&G.turn>=5)return[...ROOMS.h.npcs,['砲台くん','trt',8,5]];return ROOMS[s].npcs}
let scene='',room=null,me={x:5,y:7},face=[0,-1],canMove=false,sh=0,BT=[];

const ent=(n,s,x,y)=>({n,s,x,y});
/* ---- 描画 ---- */
const OX=7,OY=18,TF=Array.from({length:45},(_,i)=>[(i*67+13)%158,(i*41+29)%142]);

function draw(t){const bb=(t/400|0)%2;x.fillStyle='#000';x.fillRect(0,0,160,144);
if(scene=='room'){for(let j=0;j<9;j++)for(let i=0;i<10;i++){const w=i==0||j==0||i==9||j==8;x.fillStyle=w?'#111':room.f[(i+j)&1];x.fillRect(i*16,j*16,16,16)}
room.npcs.forEach(n=>sp(n[1],n[2]*16,n[3]*16+bb));sp(room.me,me.x*16,me.y*16+bb)}
else if(scene=='path'){x.fillStyle='#20301f';x.fillRect(0,0,160,144);x.fillStyle='#2c4429';TF.forEach(([a,b])=>x.fillRect(a,b,2,2));
for(let i=0;i<G.maxTurn;i++){const a=nd(i-1),b=nd(i),dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y);
if(i>0){x.fillStyle=i<=G.pos?'#e8d080':'#3f5a3c';for(let k=10;k<=16;k+=3)x.fillRect(a.x+8+dx*k-1,a.y+8+dy*k-1,2,2)}
const seen=i<=G.pos&&G.tiles[i];x.globalAlpha=seen?1:.45;sp(seen?G.tiles[i]:'q',b.x,b.y);x.globalAlpha=1}
let p=nd(G.pos);if(G.walk){const w=G.walk,u=Math.min(1,(Date.now()-w.t0)/900),A=nd(w.a),B=nd(w.b);p={x:A.x+(B.x-A.x)*u,y:A.y+(B.y-A.y)*u}}
if(G.walk||G.pos<0)sp('hero',p.x,p.y+bb,2);else{x.strokeStyle='#ff0';x.strokeRect(p.x-1.5,p.y-1.5,19,19);sp('hero',p.x+9,p.y+9,1)}}
else if(scene=='bat'){x.fillStyle='#15152a';x.fillRect(0,0,160,144);x.fillStyle='#26264a';x.fillRect(0,64,160,80);
BT.forEach(e=>sp(e.n,e.x+sh,e.y+bb*2,e.s))}}
(function L(t){draw(t);requestAnimationFrame(L)})(0);

function hud(){let s=`ターン ${G.turn}/${G.maxTurn}`;if(G.side=='d')s+=`　魔王 HP ${D.hp}/${D.mhp}　行動 ${G.act}回`;else if(G.side=='h')s+=`　勇者 HP ${H.hp}/${H.mhp}　行動 ${G.act}回`;$('hud').textContent=s}
function setBtns(a){const e=$('btns');e.innerHTML='';a.forEach(([l,f,d])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>f();if(d)b.disabled=true;e.appendChild(b)})}

function cover(t,b,f,l='画面をタップして進む',bo){$('ct').textContent=t;$('cb').textContent=b;$('cb').style.textAlign='';$('cl').textContent=l;$('msg').textContent='';$('bi').textContent='';setBtns([]);scene='';cm(false);const v=$('cv'),t0=Date.now();v.style.display='flex';v.onclick=e=>{if(bo&&!e.target.closest('#cl'))return;if(Date.now()-t0<400)return;v.style.display='none';f()}}
/* ---- 入力(仮想コントローラーなし) ---- */
const stk=$('stick'),knob=$('knob');let st=null;
function adj(){const a=room.npcs.filter(n=>Math.abs(n[2]-me.x)+Math.abs(n[3]-me.y)==1);return a.find(n=>n[2]==me.x+face[0]&&n[3]==me.y+face[1])||a[0]}
function dirOf(){if(Math.hypot(st.dx,st.dy)<16)return null;return Math.abs(st.dx)>Math.abs(st.dy)?[Math.sign(st.dx),0]:[0,Math.sign(st.dy)]}

st.iv=setInterval(()=>{if(!canMove||!st)return;const d=dirOf();if(d){st.mv=true;go(...d)}},150)});

else if(rd==1&&pl=='iro'&&H.skills.length){const sk=pick(H.skills);tx='勇者は特技を使った！';if(sk=='ためる'){d=0;charge=true;tx+='\n【ためる】次の攻撃に力を溜めている…'}else d=Math.round(base*1.3)}
else d=base;
D.hp-=d;shake();await note(d?`${tx} ${d}ダメージ`:tx,650);
if(D.hp<=0){end('h');return}
let e=Math.max(1,10+D.build-HD())+gs.reduce((s,m)=>s+Math.max(1,Math.round(mst(m).atk*.5)-HD()),0);
if(pl=='inochi'&&rnd(3)==0)e=0;
H.hp-=e;shake();await note(e?`魔王軍の攻撃！　勇者は${e}ダメージ`:'魔王軍の攻撃！　勇者は守り切った！',900);
if(dead())return}}
function end(w){if(G.over)return;G.over=true;cm(false);cover(w=='h'?'【 勇者軍の勝利！ 】':'【 魔王軍の勝利！ 】',w=='h'?'見事、魔王の討伐に成功した！\n世界に再び光と平和が戻った。\n勇者プレイヤーの勝ちです！':'勇者軍は力尽き、全滅した…\n世界は永遠の闇に包まれた。\n魔王プレイヤーの勝ちです！',resetGame,'タイトルに戻る')}
function resetGame(){G={turn:1,maxTurn:20,side:'',act:0,fog:false,pos:-1,q:[],tD:0,tH:0,tiles:[],plan:[],loot:[],pendingMerchant:null,pendingGems:0,soldInfo:null,demonNote:[],turretNote:'',dmn:0,spy:null,over:false};
D={hp:300,mhp:300,build:0,bank:0,tier:1,breedLast:-1,breedStreak:0};
H={hp:100,mhp:100,atk:10,def:2,gear:0,story:1,party:[],skills:[],plan:null,bank:0,bonus:false,gems:0,gatherLast:-1,gatherStreak:0,immuneTurn:-1,nextTile:null,cleave:false,doubleTurn:-1,cursedCave:false,vilBonus:0,quarryLv:1,trainLv:1,wagon:false,item_kobito:0,item_henge:0,item_amp:0,item_smoke:0};
scene='';BT=[];me={x:5,y:7};cm(false);title()}
/* ---- 開始 ---- */
function title(){const t=$('tt'),c=$('tc').getContext('2d'),t0=Date.now();c.clearRect(0,0,160,64);sp('demon',12,8,6,c);sp('cstl',64,16,4,c);sp('hero',100,8,6,c);
t.style.display='flex';t.onclick=()=>{if(Date.now()-t0<400)return;t.style.display='none';turnSelect()}}
async function turnSelect(){const i=await ask('ターン数を選んでください。',['10ターン（短め）','20ターン（じっくり）'],1);
G.maxTurn=[10,20][i];G.plan=Array.from({length:G.maxTurn-1},()=>pickTile());rules()}
function rules(){cover('【 遊び方 】',`・魔王軍と勇者軍が、1台のスマホを交代で操作する2人対戦。全${G.maxTurn}ターン。\n・1ターンの流れ：魔王の行動 → 勇者の行動 → 閲覧フェーズ（2人で一緒に結果を見る）。\n・行動回数は両軍とも1ターン2回。「貯める」で1回分を温存でき、最大3回まで。\n・同じ行動は、1ターンに1回まで選べる。\n・基地では画面のどこでもドラッグして移動。NPCの隣でタップすると話しかけられ、コマンドを選べる。\n・作戦やステータスは相手に秘密。待機側は画面を見ないこと。\n・${G.maxTurn}ターン目は魔王城で最終決戦（自動戦闘）。先にHPが0になった方の負け。`,
()=>cover('【 魔王軍のターンです！ 】','魔王プレイヤーに端末を渡してください。\n準備ができたら画面をタップしてください。',()=>startPhase('d')),'タップして始める');$('cb').style.textAlign='left'}
hud();title();
</script></body></html>
